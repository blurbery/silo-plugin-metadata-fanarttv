name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Reject committed local SDK replaces
        run: |
          if grep -Eq '^replace github.com/Silo-Server/silo-plugin-sdk => /' go.mod; then
            echo "go.mod contains a machine-local silo-plugin-sdk replace."
            exit 1
          fi

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        env:
          GOWORK: off
        run: go vet ./...

      - name: Run tests
        env:
          GOWORK: off
        run: go test ./...

      - name: Vulnerability audit
        env:
          GOWORK: off
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
