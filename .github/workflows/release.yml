name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # Every platform cross-compiles on Linux (CGO is off), so a release never
    # needs a macOS runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Check the tag matches manifest.json
        run: |
          manifest_version=$(jq -r '.version' manifest.json)
          if [ "v${manifest_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest.json version ${manifest_version}."
            exit 1
          fi

      # Silo installs this plugin by default and it is meant to work with no
      # setup, so a release without the built-in key is refused rather than
      # shipped idle.
      - name: Require the built-in fanart.tv key
        env:
          FANARTTV_API_KEY: ${{ secrets.FANARTTV_API_KEY }}
        run: |
          if [ -z "$FANARTTV_API_KEY" ]; then
            echo "The FANARTTV_API_KEY Actions secret is not set."
            exit 1
          fi

      - name: Build plugin binaries
        env:
          CGO_ENABLED: '0'
          GOWORK: off
          FANARTTV_API_KEY: ${{ secrets.FANARTTV_API_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          : > dist/checksums.txt
          for platform in linux/amd64 linux/arm64 darwin/arm64; do
            goos="${platform%%/*}"
            goarch="${platform##*/}"
            binary="plugin-${goos}-${goarch}"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags="-s -w -X main.version=${version} -X main.builtinAPIKey=${FANARTTV_API_KEY}" \
              -o "dist/${binary}" .
            (cd dist && sha256sum "$binary" >> checksums.txt)
          done

      # catalog.json is a one-plugin Silo catalogue in the same shape as the
      # official one. Silo reads it from releases/latest/download/catalog.json,
      # which always names this release's binaries and their checksums.
      - name: Write the Silo catalogue
        env:
          GOWORK: off
        run: |
          go run ./cmd/catalog \
            -version "${GITHUB_REF_NAME#v}" \
            -repo "https://github.com/${GITHUB_REPOSITORY}" \
            -base "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            -checksums dist/checksums.txt > dist/catalog.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/plugin-linux-amd64
            dist/plugin-linux-arm64
            dist/plugin-darwin-arm64
            dist/checksums.txt
            dist/catalog.json
          generate_release_notes: true

      # Once the plugin is approved, the community catalogue picks up each
      # release from this dispatch. Without the token it is skipped.
      - name: Notify the approved community catalogue
        env:
          DISPATCH_TOKEN: ${{ secrets.SILO_PLUGINS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::SILO_PLUGINS_DISPATCH_TOKEN is not set; the catalogue was not notified."
            exit 0
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Silo-Community/silo-plugins/dispatches \
            -d "$(printf '{"event_type":"plugin_release_published","client_payload":{"repo":"%s","tag":"%s"}}' "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}")"
